<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Animated Birthday Card</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    background:linear-gradient(#F5E600,#FF6C04,#A788F5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* FLOATING IMAGES */
.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
}

.heart{
    position:absolute;
    bottom:-100px;
    animation:floatUp linear infinite;
}

.float-img{
    width:55px;
    height:55px;
    object-fit:contain;
    opacity:20.5;
    animation:spin 20s linear infinite;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) scale(1);
        opacity:100;
    }

    10%{
        opacity:100;
    }

    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* LAYOUT */
.container{
    width:100%;
    max-width:1200px;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
    position:relative;
    z-index:2;
}

/* CONTROLS */
.controls{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.controls h2{
    margin-bottom:15px;
    color:#444;
    font-size:20px;
}

.control-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#555;
    font-size:14px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:14px;
}

textarea{
    resize:none;
    height:100px;
}

.action-btn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:white;
}

.download-btn{
    background:#F2C216;
}

.music-btn{
    background:#F26F17;
}

/* CARD */
.preview{
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:100%;
    max-width:650px;
    min-height:500px;
    border-radius:25px;
    padding:30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.18);
}

/* THEMES */
.pink{
    background:linear-gradient(#F24A43,#6F04D9,#05DBF2);
    color:#b03b6b;
}

.purple{
    background:linear-gradient(#1FE4FC,#6F04D9,#D95FCC);
    color:#7048c8;
}

.blue{
    background:linear-gradient(#3799F2,#86F26F,#F2821D);
    color:#2a6f97;
}

/* TEXT */
.card h1{
    font-family:'Dancing Script',cursive;
    font-size:2.5rem;
    margin-bottom:15px;
    color:white;
}

.message{
    font-size:1rem;
    line-height:1.6;
    margin-bottom:20px;
    color: white;
}

.signature{
    margin-top:20px;
    font-size:1.1rem;
    font-weight:600;
    color: white;
}

/* VIDEO */
video{
    width:100%;
    border-radius:18px;
    margin-top:15px;
    color coral;
}

/* IMAGE DECORATIONS */
.decor-img{
    position:absolute;
    width:90px;
    opacity:0.15;
}

.decor1{
    top:10px;
    right:10px;
}

.decor2{
    bottom:10px;
    left:10px;
}

/* MOBILE */
@media (max-width:900px){

.container{
    grid-template-columns:1fr;
}

.controls{
    order:2;
}

.preview{
    order:1;
}

.card{
    padding:20px;
}

.card h1{
    font-size:2rem;
}

}

@media (max-width:480px){

body{
    padding:10px;
}

.card h1{
    font-size:1.8rem;
}

.float-img{
    width:40px;
    height:40px;
}

}

</style>
</head>

<body>

<!-- FLOATING IMAGE CONTAINER -->
<div class="hearts" id="hearts"></div>

<audio id="bgMusic" loop></audio>

<div class="container">

<!-- CONTROLS -->
<div class="controls">

<h2>Birthday Card 🎂</h2>

<div class="control-group">
<label>Birthday Person Name</label>
<input type="text" id="momName">
</div>

<div class="control-group">
<label>Your Name</label>
<input type="text" id="fromName">
</div>

<div class="control-group">
<label>Message</label>
<textarea id="messageInput"></textarea>
</div>

<div class="control-group">
<label>Theme</label>

<select id="themeSelect">
<option value="pink">Pink</option>
<option value="purple">Purple</option>
<option value="blue">Blue</option>
</select>

</div>

<div class="control-group">
<label>Upload Video</label>
<input type="file" id="videoUpload" accept="video/*">
</div>

<div class="control-group">
<label>Upload Music</label>
<input type="file" id="musicUpload" accept="audio/*">
</div>

<button class="action-btn music-btn" id="musicToggle">
Play Music 🎵
</button>

<button class="action-btn download-btn" onclick="downloadCard()">
Download Card
</button>

</div>

<!-- CARD -->
<div class="preview">

<div class="card pink" id="card">

<!-- IMAGE DECOR -->
<img src="balloon.png" class="decor-img decor1">
<img src="cake.png" class="decor-img decor2">

<h1 id="cardTitle">Happy Birthday!</h1>

<div class="message" id="cardMessage">
Wishing you a beautiful day filled with happiness and love!
</div>

<div class="video-section">

<video id="memoryVideo" controls autoplay loop>
<source src="video.mp4" type="video/mp4">
</video>

</div>

<div class="signature" id="cardSignature">
Love, Your Friend
</div>

</div>

</div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

/* ELEMENTS */
const momName=document.getElementById("momName");
const fromName=document.getElementById("fromName");
const messageInput=document.getElementById("messageInput");
const themeSelect=document.getElementById("themeSelect");

const card=document.getElementById("card");
const cardTitle=document.getElementById("cardTitle");
const cardMessage=document.getElementById("cardMessage");
const cardSignature=document.getElementById("cardSignature");

const videoUpload=document.getElementById("videoUpload");
const memoryVideo=document.getElementById("memoryVideo");

const musicUpload=document.getElementById("musicUpload");
const bgMusic=document.getElementById("bgMusic");
const musicToggle=document.getElementById("musicToggle");

let playing=false;

/* NAME */
momName.addEventListener("input",()=>{

cardTitle.innerText = momName.value ?
`Happy Birthday, ${momName.value}!` :
"Happy Birthday!";

});

/* MESSAGE */
messageInput.addEventListener("input",()=>{

cardMessage.innerText = messageInput.value ||
"Wishing you a beautiful day filled with happiness and love!";

});

/* SIGNATURE */
fromName.addEventListener("input",()=>{

cardSignature.innerText = fromName.value ?
`Love, ${fromName.value}` :
"Love, Your Friend";

});

/* THEME */
themeSelect.addEventListener("change",()=>{

card.className="card "+themeSelect.value;

});

/* VIDEO */
videoUpload.addEventListener("change",function(){

const file=this.files[0];

if(file){
memoryVideo.src=URL.createObjectURL(file);
}

});

/* MUSIC */
musicUpload.addEventListener("change",function(){

const file=this.files[0];

if(file){
bgMusic.src=URL.createObjectURL(file);
}

});

musicToggle.addEventListener("click",()=>{

if(!playing){

bgMusic.play();
musicToggle.innerText="Pause Music ⏸";

}else{

bgMusic.pause();
musicToggle.innerText="Play Music 🎵";

}

playing=!playing;

});

/* DOWNLOAD */
function downloadCard(){

html2canvas(card).then(canvas=>{

const a=document.createElement("a");

a.download="birthday-card.png";

a.href=canvas.toDataURL();

a.click();

});

}

/* FLOATING CUSTOM IMAGES */

const hearts=document.getElementById("hearts");

/* YOUR IMAGES */
const floatingImages = [

"heart1.png",
"cake.png",
"gift.png",
"hat.png"


];

function createHeart(){

const h=document.createElement("div");

h.classList.add("heart");

const randomImg =
floatingImages[Math.floor(Math.random()*floatingImages.length)];

h.innerHTML =
`<img src="${randomImg}" class="float-img">`;

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=
(4+Math.random()*4)+"s";

hearts.appendChild(h);

setTimeout(()=>{
h.remove();
},8000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
